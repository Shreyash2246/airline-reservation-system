<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cancel Ticket</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; text-align: center; }
        input, button { width: 90%; padding: 10px; margin: 10px 0; }
    </style>
</head>

<nav style="background-color: #003366; padding: 15px; text-align: center; margin-bottom: 20px;">
        <a href="search.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Search Flights</a>
        <a href="cancel.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Cancel Ticket</a>
        <a href="admin.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Admin Panel</a>
        <a href="login.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Login / Register</a>
</nav>

<body>
    <div class="container">
        <h2>Cancel Booking</h2>
        <p>Enter your PNR number to cancel your flight.</p>
        <form id="cancelForm">
            <input type="text" id="pnrInput" placeholder="e.g., PNR9295608" required>
            <button type="submit" style="background: #dc3545; color: white; border: none;">Cancel My Ticket</button>
        </form>
        <p id="cancelMessage"></p>
    </div>

    <script>
        document.getElementById('cancelForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pnr = document.getElementById('pnrInput').value.trim();
            
            fetch(`http://localhost:8080/api/bookings/cancel/${pnr}`, {
                method: 'PUT'
            })
            .then(async res => {
                if(res.ok) {
                    const msg = await res.text();
                    document.getElementById('cancelMessage').innerHTML = `<span style="color:green;">✅ ${msg}</span>`;
                } else {
                    const err = await res.json();
                    document.getElementById('cancelMessage').innerHTML = `<span style="color:red;">❌ ${err.message}</span>`;
                }
            });
        });
    </script>
</body>

</html>
