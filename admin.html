<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Reservation - Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .admin-panel { max-width: 600px; margin: auto; padding: 20px; background: white; border: 2px solid #dc3545; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; }
        button { padding: 10px; cursor: pointer; color: white; border: none; width: 100%; }
        .btn-add { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; }
        hr { margin: 30px 0; }
    </style>
</head>
<nav style="background-color: #003366; padding: 15px; text-align: center; margin-bottom: 20px;">
        <a href="search.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Search Flights</a>
        <a href="cancel.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Cancel Ticket</a>
        <a href="admin.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Admin Panel</a>
        <a href="login.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Login / Register</a>
</nav>
<body>

    <div class="admin-panel">
        <h2 style="color: #dc3545; text-align: center;">Admin Control Panel</h2>
        
        <h3>Add New Flight</h3>
        <form id="addFlightForm">
            <div class="form-group">
                <input type="text" id="flightNum" placeholder="Flight Number (e.g., IND-505)" required>
                <input type="text" id="source" placeholder="Source City" required>
                <input type="text" id="dest" placeholder="Destination City" required>
                <label>Departure Time:</label>
                <input type="datetime-local" id="depTime" required>
                <label>Arrival Time:</label>
                <input type="datetime-local" id="arrTime" required>
                <input type="number" id="totalSeats" placeholder="Total Seats" required>
            </div>
            <button type="submit" class="btn-add">Add Flight to Database</button>
        </form>
        <p id="addMessage"></p>

        <hr>

        <h3>Delete Flight</h3>
        <form id="deleteFlightForm">
            <div class="form-group">
                <input type="number" id="deleteFlightId" placeholder="Enter Flight ID to Delete" required>
            </div>
            <button type="submit" class="btn-delete">Delete Flight</button>
        </form>
        <p id="deleteMessage"></p>
    </div>

    <script>
        // 1. Handle ADD Flight
        document.getElementById('addFlightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const flightData = {
                flightNumber: document.getElementById('flightNum').value,
                sourceCity: document.getElementById('source').value,
                destinationCity: document.getElementById('dest').value,
                departureTime: document.getElementById('depTime').value + ":00", // Append seconds for Spring Boot LocalDateTime
                arrivalTime: document.getElementById('arrTime').value + ":00",
                totalSeats: parseInt(document.getElementById('totalSeats').value),
                availableSeats: parseInt(document.getElementById('totalSeats').value) // Initially, available = total
            };

            fetch('http://localhost:8080/api/admin/flights/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(flightData)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('addMessage').innerHTML = `<span style="color:green;">Successfully added! New Flight ID: ${data.flightId}</span>`;
                document.getElementById('addFlightForm').reset();
            })
            .catch(err => document.getElementById('addMessage').innerHTML = `<span style="color:red;">Error adding flight.</span>`);
        });

        // 2. Handle DELETE Flight
        document.getElementById('deleteFlightForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const flightId = document.getElementById('deleteFlightId').value;

            fetch(`http://localhost:8080/api/admin/flights/delete/${flightId}`, {
                method: 'DELETE'
            })
            .then(async res => {
                const msg = await res.text();
                if(res.ok) {
                    document.getElementById('deleteMessage').innerHTML = `<span style="color:green;">${msg}</span>`;
                } else {
                    document.getElementById('deleteMessage').innerHTML = `<span style="color:red;">${msg}</span>`;
                }
            });
        });
    </script>
</body>
</html>
